<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canlı Durum Paneli | Adalet Simülasyonu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f1f5f9;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Arkaplan Animasyonu */
        .bg-gradient-anim {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: absolute;
            inset: 0;
            z-index: -10;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism ve Glow Efektleri */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glow-border-yellow { border-left: 4px solid #facc15; box-shadow: -5px 0 15px -5px rgba(250, 204, 21, 0.5); }
        .glow-border-red { border-left: 4px solid #ef4444; box-shadow: -5px 0 15px -5px rgba(239, 68, 68, 0.5); }
        .glow-border-blue { border-top: 4px solid #3b82f6; box-shadow: 0 -5px 15px -5px rgba(59, 130, 246, 0.5); }

        /* Animasyonlar */
        .msg-enter { animation: slideUpFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-soft { animation: pulseSoft 2s infinite; }
        @keyframes pulseSoft {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 10px rgba(250, 204, 21, 0.8); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Neon Renkler */
        .neon-text-pink { color: #f472b6; text-shadow: 0 0 5px #be185d; }
        .neon-text-cyan { color: #22d3ee; text-shadow: 0 0 5px #0e7490; }
        .neon-text-lime { color: #a3e635; text-shadow: 0 0 5px #4d7c0f; }
        .neon-text-yellow { color: #facc15; text-shadow: 0 0 5px #b45309; }
        .neon-text-purple { color: #e879f9; text-shadow: 0 0 5px #c026d3; }
        .vip-msg { background: linear-gradient(90deg, rgba(66, 32, 6, 0.8), rgba(113, 63, 18, 0.8)); border: 1px solid #facc15; }
    </style>
</head>
<body class="p-4 md:p-6 gap-4">

    <div class="bg-gradient-anim"></div>

    <header class="text-center shrink-0 mb-2 mt-2">
        <h1 class="text-2xl font-black tracking-widest text-white drop-shadow-lg uppercase">
            <i class="fa-solid fa-scale-balanced text-yellow-400 mr-2"></i>Adalet Simülasyonu
        </h1>
        <p class="text-[10px] text-slate-400 tracking-widest uppercase mt-1">Canlı Takip Paneli</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 shrink-0">
        <div class="glass-panel rounded-2xl p-5 glow-border-yellow flex flex-col justify-center relative overflow-hidden">
            <div class="absolute -right-6 -top-6 text-slate-700/30 text-7xl"><i class="fa-solid fa-microphone-lines"></i></div>
            <span class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold z-10">ŞU AN KÜRSÜDE</span>
            <h2 id="speaker-name" class="text-2xl md:text-3xl font-black text-white flex items-center gap-3 z-10">
                <i class="fa-solid fa-microphone-lines text-yellow-400 pulse-soft"></i>
                <span id="speaker-text" class="truncate">Bekleniyor...</span>
            </h2>
        </div>

        <div id="timer-container" class="glass-panel rounded-2xl p-5 glow-border-red flex flex-col justify-center items-center relative overflow-hidden transition-opacity duration-300 opacity-50">
            <div class="absolute -left-6 -bottom-6 text-slate-700/30 text-7xl"><i class="fa-solid fa-stopwatch"></i></div>
            <span class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold z-10">KALAN SÜRE</span>
            <h2 class="text-4xl md:text-5xl font-mono font-black text-red-400 z-10 drop-shadow-[0_0_10px_rgba(239,68,68,0.5)] tracking-wider" id="timer-display">
                00:00
            </h2>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-5 shrink-0 glow-border-blue mt-2 relative">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-users-viewfinder text-blue-400"></i> Jüri Vicdani Kanaati
            </h3>
            <span id="sentiment-val-text" class="text-xs font-black text-slate-900 bg-white px-2 py-1 rounded shadow">50%</span>
        </div>

        <div class="relative w-full h-8 bg-slate-700 rounded-full mb-2 overflow-hidden border border-slate-600 shadow-inner">
            <div class="absolute inset-0 bg-gradient-to-r from-purple-600 via-slate-600 to-purple-600 opacity-50"></div>
            <div id="sentiment-marker" class="absolute top-0 w-2 h-full bg-white shadow-[0_0_15px_white] transition-all duration-700 flex items-center justify-center rounded-full" style="left: 50%; transform: translateX(-50%);"></div>
        </div>
        
        <div class="flex justify-between w-full font-bold px-1 text-[10px] md:text-xs">
            <span class="text-blue-500">Dr. SELİM ARDA</span>
            <span class="text-blue-500">AYŞE DEMİR</span>
        </div>
    </div>

    <div class="glass-panel rounded-2xl flex-1 mt-2 flex flex-col overflow-hidden border-t-4 border-slate-600">
        <div class="bg-slate-900/80 p-3 border-b border-slate-700/50 flex justify-between items-center shrink-0">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-comments text-purple-400"></i> Müzakere Akışı
            </h3>
            <div class="flex items-center gap-1.5 bg-green-900/30 px-2 py-1 rounded-full border border-green-500/30">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                <span class="text-[9px] font-bold text-green-400">CANLI</span>
            </div>
        </div>
        
        <div id="chat-feed" class="flex-1 p-4 space-y-3 overflow-y-auto no-scrollbar flex flex-col-reverse">
            <div class="text-center opacity-50 my-auto pb-4">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-slate-600 mb-2"></i>
                <p class="text-xs text-slate-500">Sohbet yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    <script>
        // Orijinal projenizdeki aynı yapılandırma
        const firebaseConfig = {
            apiKey: "AIzaSyB4afTGFkOqUjeVfqfHxgKCTbGHvftZIO4",
            authDomain: "mahkeme-sim.firebaseapp.com",
            projectId: "mahkeme-sim",
            storageBucket: "mahkeme-sim.firebasestorage.app",
            messagingSenderId: "573778878408",
            appId: "1:573778878408:web:67ab4ac006df3325ec6afd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Koleksiyon isimleri
        const SETTINGS = 'sim_settings';
        const CHAT = 'sim_chat';
        const SENTIMENT = 'sim_sentiment';

        // Gerekli Değişkenler
        let timerInterval = null;
        const neonColors = ['neon-text-pink', 'neon-text-cyan', 'neon-text-lime', 'neon-text-yellow', 'neon-text-purple'];
        const avatars = { 
            m1: 'fa-solid fa-user-tie', 
            m2: 'fa-solid fa-user-graduate', 
            f1: 'fa-solid fa-user-nurse', 
            f2: 'fa-solid fa-user-doctor' 
        };

        function getNeonColor(name) { 
            return neonColors[name.length % neonColors.length]; 
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLiveDashboard();
        });

        function initLiveDashboard() {
            // 1. KÜRSÜ VE SÜRE DİNLEYİCİSİ
            db.collection(SETTINGS).doc('flow').onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    
                    // Konuşmacı Güncelleme
                    document.getElementById('speaker-text').textContent = data.current_speaker || 'Bekleniyor...';

                    // Süre Güncelleme
                    const timerContainer = document.getElementById('timer-container');
                    const timerDisplay = document.getElementById('timer-display');
                    
                    if (data.timer_end) {
                        timerContainer.classList.remove('opacity-50');
                        timerContainer.classList.add('opacity-100');
                        
                        if (timerInterval) clearInterval(timerInterval);
                        
                        timerInterval = setInterval(() => {
                            const now = new Date().getTime();
                            const distance = data.timer_end.toDate().getTime() - now;
                            
                            if (distance < 0) {
                                clearInterval(timerInterval);
                                timerDisplay.textContent = "00:00";
                                timerDisplay.classList.add('animate-pulse');
                            } else {
                                timerDisplay.classList.remove('animate-pulse');
                                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                                const s = Math.floor((distance % (1000 * 60)) / 1000);
                                timerDisplay.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                            }
                        }, 1000);
                    } else {
                        timerContainer.classList.add('opacity-50');
                        timerContainer.classList.remove('opacity-100');
                        timerDisplay.textContent = "--:--";
                        timerDisplay.classList.remove('animate-pulse');
                        if (timerInterval) clearInterval(timerInterval);
                    }
                }
            });

            // 2. VİCDANİ KANAAT DİNLEYİCİSİ
            db.collection(SENTIMENT).onSnapshot(snap => {
                let total = 0, count = 0;
                snap.forEach(doc => {
                    total += doc.data().val;
                    count++;
                });
                
                if (count > 0) {
                    const avg = total / count;
                    document.getElementById('sentiment-marker').style.left = avg + "%";
                    document.getElementById('sentiment-val-text').textContent = avg.toFixed(0) + "%";
                }
            });

            // 3. SOHBET / MÜZAKERE DİNLEYİCİSİ
            db.collection(CHAT).orderBy('timestamp', 'desc').limit(20).onSnapshot(snap => {
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = ''; 
                
                if (snap.empty) {
                    feed.innerHTML = `<div class="text-center opacity-50 my-auto pb-4"><p class="text-xs text-slate-500">Henüz mesaj yok.</p></div>`;
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    const neonClass = getNeonColor(data.author);
                    const avIcon = avatars[data.avatar] || 'fa-solid fa-user';
                    const isTeacher = data.role === 'teacher';
                    const msgStyle = isTeacher ? 'vip-msg' : 'bg-slate-800/80 border-slate-600';
                    
                    const div = document.createElement('div');
                    div.className = `${msgStyle} p-3 rounded-xl border flex gap-3 msg-enter shadow-md`;
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-full ${isTeacher ? 'bg-yellow-900 border-yellow-500' : 'bg-slate-700 border-slate-500'} border flex items-center justify-center shrink-0 shadow-inner">
                            <i class="${isTeacher ? 'fa-solid fa-crown text-yellow-400' : avIcon + ' text-slate-300'} text-xs"></i>
                        </div>
                        <div class="flex-1">
                            <b class="${isTeacher ? 'text-yellow-400' : neonClass} text-xs block mb-1 tracking-wide uppercase">${data.author}</b>
                            <p class="text-white text-sm leading-snug break-words">${data.text}</p>
                        </div>
                    `;
                    feed.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
